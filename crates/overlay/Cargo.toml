[package]
name = "monadeck-overlay"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Monadeck in-headset VR game-library launcher (OpenXR overlay)"

[[bin]]
name = "monadeck-overlay"
path = "src/main.rs"

[dependencies]
# Same in-headset stack as monado-frame (proven on the user's Monado fork).
openxr = { version = "0.21", features = ["linked"] }
ash = "0.38"
egui = "0.31"
egui-phosphor = "0.9"
egui-ash-renderer = { version = "0.8", features = ["gpu-allocator"] }
gpu-allocator = "0.27"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
# Reuse the desktop's Steam/cover scanner instead of reimplementing discovery.
monadeck-core = { path = "../core" }
# Talk to the running Monado service: detect the running game, recenter the
# playspace, arbitrate input. Same pin as core / monado-frame.
libmonado = { git = "https://github.com/wayvr-org/libmonado-rs.git", rev = "6f66b26930c24a8a2fc57ddcd85704784894c750", version = "1.6.0" }
# Pose/vector types libmonado's offset API speaks (playspace adjustment).
mint = "0.5"
# UI confirmation sounds (embedded WAVs). WAV decoding only — keep it light.
rodio = { version = "0.19", default-features = false, features = ["wav"] }
# Local wall-clock for the bottom bar.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# --- Desktop viewer (WayVR-style screen mirror) -------------------------------
# xdg-desktop-portal ScreenCast negotiation (KDE/GNOME/wlroots all speak it).
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screencast"] }
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time"] }
# The negotiated screencast stream is a PipeWire video node; frames arrive as
# DMA-BUFs (zero-copy into Vulkan) or SHM (staging upload fallback).
pipewire = { version = "0.10", features = ["v0_3_33", "v0_3_65"] }
drm-fourcc = "2.2"
# Virtual mouse + keyboard through /dev/uinput (works on every compositor —
# KWin has no wlr virtual-pointer protocol, so this is the portable route).
input-linux = "0.7"
libc = "0.2"
# Monitor layout (logical positions/sizes) so absolute pointer coordinates map
# onto the right screen: wl_output + xdg_output over the user's Wayland session.
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Key labels for the VR keyboard come from the user's real xkb keymap (0.9
# breaks keymap import on some distros — same pin WayVR uses).
xkbcommon = { version = "0.8", default-features = false }
# KDE keyboard-layout switching (org.kde.keyboard) — same zbus ashpd already pulls.
zbus = { version = "5", default-features = false, features = ["tokio", "blocking-api"] }
